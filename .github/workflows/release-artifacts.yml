name: Publish SDK artifact bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build and release immutable SDK artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Verify tag matches SDK package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build native packages and bundle
        shell: bash
        run: |
          make local
          SDK_ARTIFACTS="$RUNNER_TEMP/sdk-artifacts" python3 scripts/create-artifact-bundle.py all
          python3 scripts/verify-artifact-bundle.py "$RUNNER_TEMP/sdk-artifacts"

      - name: Create deterministic release archive
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            release_tag="$REF_NAME"
          else
            release_tag="sdk-$GITHUB_SHA"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
          python3 scripts/create-artifact-archive.py \
            "$RUNNER_TEMP/sdk-artifacts" \
            "$RUNNER_TEMP/xynoplex-sdk-artifacts-${release_tag}.tar.gz"
          cd "$RUNNER_TEMP"
          shasum -a 256 "xynoplex-sdk-artifacts-${release_tag}.tar.gz" > "xynoplex-sdk-artifacts-${release_tag}.tar.gz.sha256"

      - name: Publish the bundle as versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/xynoplex-sdk-artifacts-${release_tag}.tar.gz"
          checksum="$asset.sha256"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Immutable SDK artifact release already exists: $release_tag" >&2
            exit 1
          fi
          gh release create "$release_tag" "$asset" "$checksum" \
            --target "$GITHUB_SHA" \
            --title "Xynoplex SDK artifacts ${release_tag}" \
            --generate-notes
