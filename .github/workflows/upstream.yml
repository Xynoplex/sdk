name: Upstream lock and SDK bundle

# A product's upstream.lock.json names each upstream it builds with
# (versioning 5.4, Q2, Q3):
#
#   {
#     "schema": "xynolog-upstream-lock/v1",
#     "sdk":    {"version": "0.8.0", "commit": "<40 hex>", "sha256": "<64 hex>"},
#     "images": {"version": "26.11.0", "commit": "<40 hex>"}
#   }
#
# `commit` is what CI builds from. `version` names the upstream's release, and
# comes only with the commit its tag `v<version>` names; the SDK's comes with
# `sha256` too, its released bundle's digest. Before an upstream's first
# release, or while `commit` is ahead of the last one, an entry names `commit`
# alone. No lock names Protocol: the submodule is its one pin.
#
# Images, the cli and desktop call this from CI and from their release
# workflows, and every job that builds with the SDK needs it:
#
#   upstream:
#     uses: xynolog/sdk/.github/workflows/upstream.yml@<commit>
#     with:
#       languages: go
#       release: false
#
# It refuses a lock whose `version` does not name its `commit` (the census of
# the lock's restatement of each tag), and, with `release`, one that names an
# upstream by commit alone. It yields the SDK bundle as the artifact
# `sdk-artifacts`: the SDK release's bundle, downloaded and checked against
# `sha256`, when the lock names one; else the bundle built from `commit`. So
# once the lock names a release, CI tests the bytes a release ships.
on:
  workflow_call:
    inputs:
      languages:
        description: The SDK languages the product builds with, space-separated
        type: string
        required: true
      release:
        description: Whether this run releases the product
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  sdk:
    name: Upstream lock and SDK bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: The lock names each upstream release by the commit its tag names
        id: lock
        env:
          RELEASE: ${{ inputs.release }}
        shell: python3 {0}
        run: |
          import json, os, re, subprocess, sys

          def fail(message):
              print(f"::error::upstream.lock.json: {message}")
              sys.exit(1)

          lock = json.load(open("upstream.lock.json"))
          if lock.get("schema") != "xynolog-upstream-lock/v1":
              fail(f"schema {lock.get('schema')!r} is not xynolog-upstream-lock/v1")
          upstreams = {name: entry for name, entry in lock.items() if name != "schema"}
          if "sdk" not in upstreams:
              fail("names no sdk")
          for name, entry in upstreams.items():
              if name not in ("sdk", "images", "cli"):
                  fail(f"names {name!r}, which is no Xynolog upstream")
              released = {"commit", "version", "sha256"} if name == "sdk" else {"commit", "version"}
              if set(entry) not in ({"commit"}, released):
                  fail(f"{name} names {sorted(entry)}: either a commit alone, or {sorted(released)}")
              if not re.fullmatch(r"[0-9a-f]{40}", entry["commit"]):
                  fail(f"{name}'s commit {entry['commit']!r} is not a full commit hash")
              if "version" not in entry:
                  if os.environ["RELEASE"] == "true":
                      fail(f"a release builds with released upstreams, and {name} names only a commit")
                  continue
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", entry["version"]):
                  fail(f"{name}'s version {entry['version']!r} is not X.Y.Z")
              if name == "sdk" and not re.fullmatch(r"[0-9a-f]{64}", entry["sha256"]):
                  fail(f"sdk's sha256 {entry['sha256']!r} is not a full SHA-256")
              tag = f"refs/tags/v{entry['version']}"
              listed = subprocess.run(
                  ["git", "ls-remote", "--tags", f"https://github.com/xynolog/{name}", tag, f"{tag}^{{}}"],
                  stdout=subprocess.PIPE, text=True, check=True,
              ).stdout.splitlines()
              # An annotated tag lists its commit as the peeled ref; a lightweight one, as itself.
              commits = dict(reversed(line.split("\t")) for line in listed)
              tagged = commits.get(f"{tag}^{{}}", commits.get(tag))
              if tagged is None:
                  fail(f"{name} {entry['version']} is not released: xynolog/{name} has no {tag}")
              if tagged != entry["commit"]:
                  fail(f"{name} {entry['version']} is tagged at {tagged}, not at the lock's commit {entry['commit']}")
          sdk = upstreams["sdk"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={sdk['commit']}\n")
              if "version" in sdk:
                  output.write(f"tag=v{sdk['version']}\nsha256={sdk['sha256']}\n")

      - name: Check out the pinned SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: xynolog/sdk
          ref: ${{ steps.lock.outputs.commit }}
          path: .xynolog-sdk
          submodules: ${{ steps.lock.outputs.tag == '' }}

      - name: Restore the bundle built from the pin
        if: steps.lock.outputs.tag == ''
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sdk-artifacts
          key: xynolog-sdk-${{ steps.lock.outputs.commit }}-${{ inputs.languages }}

      - name: Build the bundle from the pinned commit
        if: steps.lock.outputs.tag == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          LANGUAGES: ${{ inputs.languages }}
        run: |
          read -r -a languages <<< "$LANGUAGES"
          built="$(bash .xynolog-sdk/scripts/resolve-artifact-bundle.sh "${languages[@]}")"
          cp -a "$built" "$BUNDLE"

      - name: The downloader's languages and Protocol commit
        if: steps.lock.outputs.tag != ''
        id: downloader
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          {
            echo "languages=$(tr -s ' ' ',' <<< "$LANGUAGES")"
            echo "protocol=$(git ls-tree HEAD protocol | awk '{print $3}')"
          } >> "$GITHUB_OUTPUT"

      - name: Download the SDK release's bundle by its digest
        if: steps.lock.outputs.tag != ''
        id: download
        uses: ./.xynolog-sdk/.github/actions/download-bundle
        with:
          tag: ${{ steps.lock.outputs.tag }}
          commit: ${{ steps.lock.outputs.commit }}
          protocol-commit: ${{ steps.downloader.outputs.protocol }}
          sha256: ${{ steps.lock.outputs.sha256 }}
          languages: ${{ steps.downloader.outputs.languages }}

      - name: Place the downloaded bundle
        if: steps.lock.outputs.tag != ''
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          DOWNLOADED: ${{ steps.download.outputs.path }}
        run: cp -a "$DOWNLOADED" "$BUNDLE"

      - name: Verify the bundle against the SDK and Protocol pins
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          SDK_COMMIT: ${{ steps.lock.outputs.commit }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          languages=()
          for language in $LANGUAGES; do languages+=(--language "$language"); done
          python3 "$BUNDLE/tools/verify-artifact-bundle.py" "$BUNDLE" \
            --sdk-commit "$SDK_COMMIT" \
            --protocol-commit "$(git ls-tree HEAD protocol | awk '{print $3}')" \
            "${languages[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: error
          include-hidden-files: true
