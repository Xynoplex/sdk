name: Xynoplex SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A pull request's newer push supersedes its older run; main and the merge
# queue keep every run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Make help, the source archive, and the SDK languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A pull request checks out its merge commit: the first parent is
          # the base, so HEAD^1..HEAD is the pull request's change.
          fetch-depth: 2

      - name: Make help lists every public target
        run: python3 scripts/test_make_help.py

      - name: The source archive holds no broken symlink
        run: |
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          broken="$(find "$archive" -xtype l)"
          test -z "$broken" || { printf 'Broken in the source archive GitHub serves to action users:\n%s\n' "$broken" >&2; exit 1; }

      # A pull request builds the languages its change touches; main and the
      # merge queue build every language, so a read the search misses still
      # fails before a release.
      - name: List the SDK languages to build
        id: languages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          languages="$(printf 'print-%%:\n\t@echo $($*)\n' | make -s --no-print-directory -f Makefile -f - print-LANGUAGES)"
          if [[ "$EVENT" == pull_request ]]; then
            selected="$(python3 scripts/changed-languages.py HEAD^1 HEAD $languages)"
          else
            selected="$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $languages)"
          fi
          echo "Building: $selected"
          echo "languages=$selected" >> "$GITHUB_OUTPUT"

  artifacts:
    name: ${{ matrix.language }} SDK artifacts from pinned Protocol
    needs: checks
    if: needs.checks.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.checks.outputs.languages) }}
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build and verify the language's bundle
        run: |
          make "$LANGUAGE"
          SDK_ARTIFACTS="$(python3 scripts/create-artifact-bundle.py --path "$LANGUAGE")" make verify-artifacts

  go-sdk:
    name: Go SDK tests and coverage
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.languages), 'go')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test with coverage
        run: make test

      - name: Upload coverage to Codecov
        # Codecov rejects tokenless uploads for this organization; configure CODECOV_TOKEN to enable reports.
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: go-sdk
          fail_ci_if_error: false
