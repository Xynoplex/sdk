name: Go SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  go-sdk:
    name: Go SDK tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test with coverage
        run: make test

      - name: Upload coverage to Codecov
        # Codecov rejects tokenless uploads for this organization; configure CODECOV_TOKEN to enable reports.
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: go-sdk
          fail_ci_if_error: false
