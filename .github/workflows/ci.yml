name: Xynoplex SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes an older one. A
# merge queue entry has a ref of its own, so entries never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (the org's
  # CONTRIBUTING.md).
  dco:
    uses: xynolog/.github/.github/workflows/dco.yml@b3dcbb9f9db37476c2bd259711ebaac6df777fbf

  # On a push to main, the repository's labels become the org's seven.
  labels:
    uses: xynolog/.github/.github/workflows/labels.yml@b3dcbb9f9db37476c2bd259711ebaac6df777fbf
    permissions:
      issues: write

  checks:
    name: Make help, the source archive, and the SDK languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A pull request checks out its merge commit: the first parent is
          # the base, so HEAD^1..HEAD is the pull request's change.
          fetch-depth: 2
          submodules: true

      - name: Make help lists every public target
        run: python3 build-tools/test_make_help.py --root . --list '<language>=LANGUAGES'

      - name: The source archive holds no broken symlink
        run: |
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          broken="$(find "$archive" -xtype l)"
          test -z "$broken" || { printf 'Broken in the source archive GitHub serves to action users:\n%s\n' "$broken" >&2; exit 1; }

      # A pull request builds the languages its change touches; main and the
      # merge queue build every language, so a read the search misses still
      # fails before a release.
      - name: List the SDK languages to build
        id: languages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          languages="$(printf 'print-%%:\n\t@echo $($*)\n' | make -s --no-print-directory -f Makefile -f - print-LANGUAGES)"
          if [[ "$EVENT" == pull_request ]]; then
            selected="$(python3 scripts/changed-languages.py HEAD^1 HEAD $languages)"
          else
            selected="$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $languages)"
          fi
          echo "Building: $selected"
          echo "languages=$selected" >> "$GITHUB_OUTPUT"

  artifacts:
    name: ${{ matrix.language }} SDK artifacts from pinned Protocol
    needs: checks
    if: needs.checks.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.checks.outputs.languages) }}
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build and verify the language's bundle
        run: |
          make "$LANGUAGE"
          SDK_ARTIFACTS="$(python3 scripts/create-artifact-bundle.py --path "$LANGUAGE")" make verify-artifacts

  go-sdk:
    name: Go SDK tests and coverage
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.languages), 'go')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test with coverage
        run: make test

      - name: Upload coverage to Codecov
        # Codecov rejects tokenless uploads for this organization; configure CODECOV_TOKEN to enable reports.
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          flags: go-sdk
          fail_ci_if_error: false

  # What the ruleset requires. It waits for every other job, a census holds
  # that list to the workflow's jobs, and it fails when any of them failed or
  # was cancelled. A job skipped by its own condition passes.
  gate:
    name: CI Gate
    if: always()
    needs: [dco, labels, checks, artifacts, go-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: The gate waits for every other job
        run: |
          jobs="$(yq '.jobs | keys | .[] | select(. != "gate")' .github/workflows/ci.yml | sort)"
          waits="$(yq '.jobs.gate.needs[]' .github/workflows/ci.yml | sort)"
          if [ "$jobs" != "$waits" ]; then
            echo "CI Gate's needs differ from the workflow's jobs (< jobs, > needs):" >&2
            diff <(echo "$jobs") <(echo "$waits") >&2
            exit 1
          fi
      - name: Every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
