version: 2

# One pull request per language, twice a month at most: every language's
# updates are one group, proposed on the 1st and the 15th, with no more than
# one PR open. Go's three modules are one group across their directories, and
# Rust's crates and toolchain one group across their two ecosystems. A release
# waits a week before it is proposed, and a major release a month where the
# ecosystem reads semver (not GitHub Actions or Docker).

multi-ecosystem-groups:
  rust:
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /go
      - /go/conformance
      - /scripts/go-module-zip
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /rust
    multi-ecosystem-group: rust
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: rust-toolchain
    directory: /rust
    multi-ecosystem-group: rust
    patterns: ["*"]

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      typescript:
        patterns: ["*"]
    ignore:
      # openapi-typescript generates the types through TypeScript's JavaScript
      # API, which TypeScript 7 does not have: core's build fails on it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /python/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /csharp/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      csharp:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /kotlin/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      kotlin:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /swift/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      swift:
        patterns: ["*"]
