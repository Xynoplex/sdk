version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /go/conformance
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /scripts/go-module-zip
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: rust-toolchain
    directory: /rust
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /python/sdk
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /csharp/sdk
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /kotlin/sdk
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /swift/sdk
    schedule:
      interval: weekly

