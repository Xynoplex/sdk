version: 2

# One pull request per language, twice a month at most: every language's
# updates are one group, proposed on the 1st and the 15th, with no more than
# one PR open. Go's three modules are one group across their directories, and
# Rust's crates and toolchain one group across their two ecosystems. A release
# waits a week before it is proposed, and a major release a month where the
# ecosystem reads semver (not GitHub Actions or Docker).

# Security updates are grouped the same way, in a group of each entry's own,
# and Dependabot raises them when an advisory is published, not on the
# schedule; neither the cooldown nor the one-PR limit holds them back.
# Rust's crates and toolchain are not: whether an entry in a
# multi-ecosystem group may also have groups of its own is undocumented.

multi-ecosystem-groups:
  rust:
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"

updates:
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    labels: ["dependencies"]
    directories:
      - /go
      - /go/conformance
      - /scripts/go-module-zip
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go:
        patterns: ["*"]

  - package-ecosystem: cargo
    labels: ["dependencies"]
    directory: /rust
    multi-ecosystem-group: rust
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: rust-toolchain
    labels: ["dependencies"]
    directory: /rust
    multi-ecosystem-group: rust
    patterns: ["*"]

  - package-ecosystem: npm
    labels: ["dependencies"]
    directory: /typescript
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      typescript-security:
        applies-to: security-updates
        patterns: ["*"]
      typescript:
        patterns: ["*"]
    ignore:
      # openapi-typescript generates the types through TypeScript's JavaScript
      # API, which TypeScript 7 does not have: core's build fails on it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    labels: ["dependencies"]
    directory: /python/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python:
        patterns: ["*"]

  - package-ecosystem: nuget
    labels: ["dependencies"]
    directory: /csharp/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      csharp-security:
        applies-to: security-updates
        patterns: ["*"]
      csharp:
        patterns: ["*"]

  - package-ecosystem: gradle
    labels: ["dependencies"]
    directory: /kotlin/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      kotlin-security:
        applies-to: security-updates
        patterns: ["*"]
      kotlin:
        patterns: ["*"]

  - package-ecosystem: swift
    labels: ["dependencies"]
    directory: /swift/sdk
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      swift-security:
        applies-to: security-updates
        patterns: ["*"]
      swift:
        patterns: ["*"]
