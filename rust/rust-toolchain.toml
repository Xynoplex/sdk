# The toolchain every Rust build in the repository uses. rustup reads this
# file wherever cargo runs in rust. A Rust image's tag is its `channel`
# (rust:<channel>-bookworm), which rust/scripts/rust-toolchain.sh prints, so
# the version is written here and nowhere else.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
