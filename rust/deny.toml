# cargo-deny's checks of the crates the workspace links. CI's crates job runs
#
#   cargo deny --locked check bans sources
#
# Not `advisories`: build-tools/advisories.py scans Cargo.lock with every other
# lockfile, against advisories.toml at the repository's root;
# and not `licenses`: no licence policy holds the SDK's crates yet.

[bans]
# Two versions of one crate cost size, not safety.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates name each other by path, with no version; none
# is published, so a path is exact, not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
