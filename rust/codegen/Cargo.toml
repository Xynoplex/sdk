[package]
name = "xynoplex-codegen"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
description = "Build-time generation from protocol/specs/: the bundled spec documents and the Rust types of their component schemas. A build dependency of xynoplex and xynoplex-core; no binary links it."
documentation = "https://docs.rs/xynoplex-codegen"
keywords = ["xynoplex", "codegen", "openapi", "json-schema"]
categories = ["development-tools::build-utils"]

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
